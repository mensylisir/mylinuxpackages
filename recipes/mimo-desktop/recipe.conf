# The same app is also distributed by the vendor as "xiaomi-mimo-desktop" (deb/rpm share the
# name). Both packages own identical paths, so the vendor package must be
# replaced on install instead of failing dpkg with file-overwrite errors.
CONFLICTS_DEB=(
  "xiaomi-mimo-desktop"
)
REPLACES_DEB=(
  "xiaomi-mimo-desktop"
)
CONFLICTS_RPM=(
  "xiaomi-mimo-desktop"
)
OBSOLETES_RPM=(
  "xiaomi-mimo-desktop"
)

