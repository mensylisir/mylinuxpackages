# The same app is also distributed by the vendor as "qoder-cn" (deb/rpm share the
# name). Both packages own identical paths, so the vendor package must be
# replaced on install instead of failing dpkg with file-overwrite errors.
CONFLICTS_DEB=(
  "qoder-cn"
)
REPLACES_DEB=(
  "qoder-cn"
)
CONFLICTS_RPM=(
  "qoder-cn"
)
OBSOLETES_RPM=(
