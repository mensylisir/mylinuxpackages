# Recipe: ClaudeMom (API-key login mode for Claude Desktop)
# Upstream ships only macOS (dmg) and Windows (exe) installers, so this recipe
# builds the Tauri desktop app from the source tarball; see stage.sh.
APP_ID="claudemom"
PKG_NAME="claudemom"
VERSION="0.1.9"
DISPLAY_NAME="ClaudeMom"
STRING_NAME="claudemom"
EXEC_NAME="claudemom"
APP_DIR="claudemom"
URL="https://github.com/BigPizzaV3/ClaudeMom"
DESCRIPTION="ClaudeMom: use an Anthropic-compatible API key in Claude Desktop login mode"
ARCH="x86_64"
STAGE_MODE="recipe"

# Runtime links system webkit2gtk; the local compat service runs on Node.js
# (README: Node.js 22+). The binary itself is self-contained (assets embedded).
DEPENDS_DEB=(
  "libwebkit2gtk-4.1-0" "libgtk-3-0" "libsoup-3.0-0" "libjavascriptcoregtk-4.1-0"
  "libayatana-appindicator3-1" "nodejs (>= 22)"
)
DEPENDS_RPM=(
  "webkit2gtk4.1" "gtk3" "libsoup3" "libayatana-appindicator-gtk3" "nodejs"
)

SOURCES=(
  "claudemom-v${VERSION}.tar.gz|https://github.com/BigPizzaV3/ClaudeMom/archive/refs/tags/v${VERSION}.tar.gz|da0c838996c31f438b4b2f0877e37103a63f95205f8d69e35418849b46efd34d"
)
