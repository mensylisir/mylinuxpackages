# Recipe: appclone (independent mylinuxpackages recipe)
APP_ID="appclone"
PKG_NAME="appclone-bin"
VERSION="1.1.2"
DISPLAY_NAME="AppClone"
STRING_NAME="appclone-bin"
APP_DIR="appclone-bin"
URL="https://github.com/mensylisir/appclone"
DESCRIPTION="为任意 Linux 应用再开一个分身，只隔离它自己的数据（预编译版本）"
ARCH="x86_64"
STAGE_MODE="recipe"

# Runtime dependencies mapped to native deb/rpm package names.
DEPENDS_DEB=(
  "libgtk-4-1"
  "libadwaita-1-0"
  "bubblewrap"
  "desktop-file-utils"
  "libglib2.0-0"
)
DEPENDS_RPM=(
  "gtk4"
  "libadwaita"
  "bubblewrap"
  "desktop-file-utils"
  "glib2"
)

# The same app is also distributed by the vendor as "appclone" (deb/rpm share the
# name). Both packages own identical paths, so the vendor package must be
# replaced on install instead of failing dpkg with file-overwrite errors.
CONFLICTS_DEB=(
  "appclone"
)
REPLACES_DEB=(
  "appclone"
)
CONFLICTS_RPM=(
  "appclone"
)
OBSOLETES_RPM=(
  "appclone"
)

SOURCES=(
  "appclone_1.1.2_linux_amd64.tar.gz|https://github.com/mensylisir/appclone/releases/download/v1.1.2/appclone_1.1.2_linux_amd64.tar.gz|ea1de09a4c67b1af2389e48b69da4511551d2d077ebc1ee66cff88606d79af56"
)

NOEXTRACT=()
