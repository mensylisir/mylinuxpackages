# The same app is also distributed by the vendor as "qoder" (deb/rpm share the
# name). Both packages own identical paths, so the vendor package must be
# replaced on install instead of failing dpkg with file-overwrite errors.
CONFLICTS_DEB=(
  "qoder"
)
REPLACES_DEB=(
  "qoder"
)
CONFLICTS_RPM=(
  "qoder"
)
OBSOLETES_RPM=(
  "qoder"
)

