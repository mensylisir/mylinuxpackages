name: build-packages

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe to build'
        required: true
        type: choice
        options:
          - all
          - appclone
          - catpaw
          - catpaw-cn
          - dumate-app
          - gw2api
          - kimi-code-cn
          - kimi-code-intl
          - kimi-work
          - kimi-work-cn
          - kimi-work-intl
          - mimo-desktop
          - mimo-desktop-intl
          - minimax-code-cli
          - minimax-code-cn
          - minimax-code-intl
          - qoder-agent
          - qoder-cn-agent
          - qoder-cn-ide
          - qoder-ide
          - qoderwake
          - qoderwake-cn
          - trae-cn-ide
          - trae-ide
          - workbuddy
          - workbuddy-intl
          - zcode-cn
          - zcode-intl
        default: all
      target:
        description: 'Package format'
        required: true
        type: choice
        options:
          - all
          - deb
          - rpm
        default: all
      tag:
        description: 'Release tag (blank = v<version> from recipe)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: set-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # One release per run: every recipe uploads into the same tag, so
          # parallel jobs never race to create different releases.
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" \
              --notes "Automated build run ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          fi

      - name: Resolve recipe matrix
        id: set-matrix
        shell: bash
        run: |
          RECIPE="${{ inputs.recipe }}"
          if [ -z "$RECIPE" ] || [ "$RECIPE" = "all" ]; then
            JSON=$(find recipes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length>0))')
          else
            JSON=$(printf '%s' "$RECIPE" | jq -R -s -c 'split("\n") | map(select(length>0))')
          fi
          echo "matrix={\"recipe\":$JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip rpm file xz-utils \
            build-essential python3 curl
          npm install -g @electron/asar node-gyp

      - name: Build recipe ${{ matrix.recipe }}
        shell: bash
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          TARGET="${TARGET_INPUT:-all}"
          ./build-package.sh "recipes/${{ matrix.recipe }}/recipe.conf" --"$TARGET"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: false
          files: |
            out/*.deb
            out/*.rpm
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.recipe }}
          path: |
            out/*.deb
            out/*.rpm
          if-no-files-found: warn
